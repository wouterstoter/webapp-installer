<script>


// http://username:password@host.com:0/pathname?search#hash
var basicurl = new URL("http://host.com:0")

basicurl.username = "username"
basicurl.password = "password"

// const
const BASE = new URL("http://localhost:9000/");
const APP_EXTS = ["zip","har","app"];

// new function
let AppExtRegEx = new RegExp("(?<=\.(?:" + APP_EXTS.map(RegExp.escape).join("|") + "))\/","gi")
let base_apppaths = {};
function wURL(url,base) {
    'use strict';

    if (typeof base === "string") base = new URL(".", base || BASE);
    if (base.origin != BASE.origin || !base.pathname.startsWith(BASE.pathname)) throw new Error("Invalid base");

    if (typeof url === "string") url = new URL(url,base);

    let regex = new RegExp("(?<=\.(?:" + APP_EXTS.map(RegExp.escape).join("|") + "))\/","gi")
    function validPath(path) {
        if (!/^[^\/]+:/.test(path)) return path;
        let p = new URL(path.replace(/^https:/,"http:"),"http://localhost/");
        if (p.username || p.password) {
            url.username = p.username
            url.password = p.password
            p.username = p.password = ""
        }
        return p.hostname == "localhost" ? p.pathname.slice(1) : p
    }

    if (url.origin != BASE.origin || !url.pathname.startsWith(BASE.pathname)) {
        if (url.origin != BASE.origin) {
            url.pathname = url.origin + url.pathname;
            if (url.protocol != BASE.protocol) url.href = BASE.protocol + url.href.slice(url.protocol.length);
            url.host = BASE.host;
        }
        if (!base_apppaths[base]) { // Allow passing on the base appath between requests
            base.apppath = base.pathname.slice(BASE.pathname.length).split(AppExtRegEx).map(validPath)
            var last = base.apppath.pop();
            if (last.origin) base.apppath.push(last.origin);
            base_apppaths[base] = base.apppath;
        } else {
            base.apppath = base_apppaths[base];
        }
        url.apppath = base.apppath.concat(url.pathname.slice(1).split(AppExtRegEx).map(validPath))
    } else {
        url.apppath = url.pathname.slice(BASE.pathname.length).split(AppExtRegEx).map(validPath)
    }
    url.pathname = BASE.pathname + url.apppath.join("/");
    return url;
}



// Newest

function wURL2(url,base) {
  base = base || BASE;
  if (!(base instanceof URL || URL.canParse(base))) base = wURL(base, BASE);


  // Convert absolute URL to relative URL
  var auth = "";
  var search = "";
  var hash = "";
  if (url instanceof URL || URL.canParse(url)) {
    url = url.toString();
    base = base.toString();

    // store hash and search seperately
    let h = url.indexOf("#");
    if (h != -1) {
      hash = url.slice(h);
      url = url.slice(0,h);
    }
    let s = url.indexOf("#");
    if (s != -1) {
      search = url.slice(s);
      url = url.slice(0,s);
    }
    url = url.split("/");
    base = base.split("/");
    shared = [];
    // store auth seperately
    if (base[2].split("@").length == 2) [ auth, base[2] ] = base[2].split("@")
    if (url[2].split("@").length == 2) [ auth, url[2] ] = url[2].split("@")
    while (url[0] == base[0]) {
      shared.push(url[0])
      url = url.slice(1)
      base = base.slice(1)
    }
    if (shared.length > 3) {
      url = "../".repeat(base.length - 1) + url.join("/") + search + hash;
    } else if (shared.length == 2) {
      url = "//" + url.join("/");
    } else {
      url = url.join("/");
      if (url.startsWith("https:")) url = "http:" + url.slice("https:".length);
    }

    base = shared.concat(base);
    if (auth) base[2] = auth + "@" + base[2]
    base = base.join('/')
  }
  if (typeof base === "string") base = new URL(base);
  let apppath = base.pathname.slice(BASE.pathname.length).split(AppExtRegEx)
  var last = apppath.pop();
  last = new URL(last,"http://localhost/");
  last = new URL(url,last);
  if (last.username || last.password) {
    [base.username , base.password] = [last.username , last.password];
    last.username = last.password = "";
  }
  function validPath(path) {
      if (!/^[^\/]+:/.test(path)) return path;
      let p = new URL(path.replace(/^https:/,"http:"),"http://localhost/");
      if (p.username || p.password) {
          [base.username , base.password] = [p.username , p.password];
          p.username = p.password = ""
      }
      return p.hostname == "localhost" ? p.pathname.slice(1) : p
  }
  last.pathname = "/" + last.pathname.slice(1).split(AppExtRegEx).map(validPath).join("/");
  last = last.hostname == "localhost" ? last.href.slice(last.origin.length + 1) : last.href;
  apppath.push(last)
  
  base.pathname = base.search = base.hash = "";
  return base.href + apppath.join("/");
}

// Old func
let base = BASE
let app_exts = APP_EXTS
function relativeURL(url,referrer) {
  if (!referrer) referrer = base.href;
  var app_base = appFromURL(referrer)
  if (app_base) app_base += "/";
  var url = (function recursive(url,referrer) {
    url = new URL(url,referrer);
    if (!url.href.startsWith(base.href)) {
       // Resolve case differences in base
      if (url.href.toLowerCase().startsWith(base.href.toLowerCase())) return recursive(base.href + url.href.slice(base.href.length),referrer);
      // Resolve external urls
      if (!url.href.startsWith(base.origin + "/")) return recursive(base.href + app_base + url.href,referrer);
      // Resolve relative urls
      var target;
      try {
        target = (new URL(url.href.slice(url.origin.length),referrer.slice((base.href + app_base).length))).href
      } catch(e) {
        target = url.pathname.slice(1);
      }
      return recursive(base.href + app_base + target,referrer);
    }
    // Replace all instances of https in the pathname with http
    if (url.pathname.toLowerCase().indexOf("/https:/") != -1) {
      url.pathname = url.pathname.replaceAll("/https:/","/http:/")
      return recursive(url.href,referrer);
    }
    return url;
  })(url,referrer)
  return url;
}
function appFromURL(url) {
  if (!url.toLowerCase().startsWith(base.href.toLowerCase())) return "";
  var app_base = url.slice(base.href.length);
  var first = true;
  while (app_base.length > 0 && (first || !app_exts.some(ext => app_base.toLowerCase().endsWith("." + ext)))) {
    app_base = app_base.split("/").slice(0,-1).join("/");
    first = false;
  }
  return app_base
}

function benchmark(url,base) {
    var old, mid, fin;
    var start = performance.now();
    try {
        old = Array.from({length: 1000},() => relativeURL(url,base))[0];
    } catch(e) {
        old = "error"
    }
    var middle = performance.now();
    var fin = Array.from({length: 1000},() => wURL2(url,base))[0];
    var end2 = performance.now();
    try {
        mid = Array.from({length: 1000},() => wURL(url,base))[0];
    } catch(e) {
        mid = "error"
    }
    var end = performance.now();
    (fin == mid.href ? console.log : console.error)(`URL: ${url}\nBAS: ${base}\nOLD: ${old} (${middle - start})\nMID: ${mid} (${end2 - middle})\nNEW: ${fin} (${end - end2})`)
    return fin;
}
//benchmark("perry.zip",BASE.href + "phf_app.zip/PErry.har/index.html")
benchmark("https://test@gooGLE.com/",BASE.href + "phf_app.zip/perry.har/index.html")
