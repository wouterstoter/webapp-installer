<!DOCTYPE html>
<html>
  <head>
    <title>WebApp Installer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon-512x512.png">
  </head>
  <body>
    <input type="file" accept=".zip, .har, .app" style="display:none;"></input><br/>
    <input type="file" webkitdirectory directory multiple style="display:none;"/><br/>
    
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('service-worker.js',{scope: '.',type: 'module'}).then(function(registration) {
            // Registration was successful
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
            document.querySelector("input").style.display = "";
            document.querySelector("input[directory]").style.display = "";
          }, function(err) {
            console.error('ServiceWorker registration failed: ', err);
          });
          navigator.serviceWorker.ready.then((registration) => {
            registration.active.onerror = (event) => {
              console.error("[SW]", event);
            };
          });
        });
      }
      
      // Send the zip to the service worker whenever it is uploaded
      document.querySelector("input").onchange = function() {
        var input = this.files[0];
        
        input.arrayBuffer()
        .then(file => new Uint8Array(file))
        .then(file => {
          navigator.serviceWorker.ready.then(registration => {
            fetch(input.name, {
              method: 'PUT',
              headers:{
                "Last-Modified": new Date(input.lastModified).toUTCString(), 
                "Content-type": input.type, 
                "Content-length": input.size
              },
              body: file
            }).then(() => window.location.reload())
          });
        });
      }
      document.querySelector("input[directory]").onchange = function() {
        navigator.serviceWorker.ready.then(registration => {
          var files = this.files;
          var filename = files[0].webkitRelativePath.split("/")[0];
          if (!filename.toLowerCase().endsWith(".app")) filename += ".app";
          fetch(filename, {method: 'PUT'})
          .then(() => {
            var promises = [...files].map(f => {
              return f.arrayBuffer()
              .then(file => new Uint8Array(file))
              .then(file => {
                var filename = f.webkitRelativePath.split("/");
                if (!filename[0].toLowerCase().endsWith(".app")) filename[0] += ".app";
                filename = filename.join("/")
                return fetch(filename, {
                  method: 'PUT',
                  headers:{
                    "Last-Modified": new Date(f.lastModified).toUTCString(), 
                    "Content-type": f.type, 
                    "Content-length": f.size
                  },
                  body: file
                })
              });
              promises.push(promise);
            })
            Promise.all(promises)
            .then(() => window.location.reload());
          });
        })
      }
      
      window.onbeforeunload = function() {
        navigator.serviceWorker.controller.postMessage("close");
      }
      
      window.onmessage = (event) => {
        try { 
          var data = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
          if (!data.log) return
          navigator.serviceWorker.ready.then(registration => {
            navigator.serviceWorker.controller.postMessage(data);
          });
        } catch(e) {}
      }
      
      const app_exts = ["zip","har","app"]
      caches.keys()
      .then(keys => {
        keys = keys.sort();
        for (i = 0; i < keys.length; ++i) {
          if (app_exts.indexOf(keys[i].split(".").slice(-1)[0].toLowerCase()) == -1) continue
          document.body.appendChild(document.createElement('br'));
          var img = document.createElement("img");
          img.src = keys[i] + "/favicon.ico";
          img.style = "width:16px;height:16px";
          document.body.appendChild(img);
          document.body.appendChild(document.createTextNode(' '));
          let a = document.createElement("a");
          a.href = keys[i] + "/";
          a.innerText = keys[i];
          document.body.appendChild(a);
          document.body.appendChild(document.createTextNode(' '));
          let a2 = document.createElement("a");
          a2.href = keys[i];
          a2.innerText = "delete";
          a2.style = "float:right";
          a2.onclick = (e) => {e.preventDefault();fetch(e.target.href,{method:"DELETE"}).then(() => window.location.reload())}
          document.body.appendChild(a2);
        }
      })
    </script>
  </body>
</html>
